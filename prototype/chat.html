      <div class="profile-row">
        <div class="profile-avatar">H</div>
        <div>

          <div class="profile-sub">v0.20.1 · Nous Research</div>
        </div>
      </div>

  <div class="main">
    <div class="topbar">
      <h1>Friendly greeting</h1>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌓</button>
        <button class="btn">solar-pro4:free ▾</button>
      </div>
    </div>
    <div class="content">
      <div class="chat-feed">
        <div class="msg user">
          <div class="avatar">Z</div>
          <div class="bubble">hey</div>
        </div>
        <div class="msg">
          <div class="avatar">⚕</div>
          <div class="bubble">Hey! How can I help you today?</div>
        </div>
      </div>
      <div class="chips">
        <div class="chip">Summarize my last 5 emails</div>
        <div class="chip">Draft a Linear ticket</div>
        <div class="chip">Schedule a recurring report</div>
      </div>
      <div class="chat-input-bar">
        <input type="text" placeholder="Message Hermes…" />
        <button class="btn btn-primary">Send</button>
      </div>
    </div>
  </div>
